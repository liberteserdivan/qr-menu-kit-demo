<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>Menu</title>
<style>
:root{--bg:#F4EFE6;--text:#1E1B2E;--accent:#FF6B4A;--card:#FFFFFF;--muted:color-mix(in srgb,var(--text) 60%,transparent);--line:color-mix(in srgb,var(--text) 12%,transparent);--r:16px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.45;min-height:100vh}
img{display:block;max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.hero{padding:36px 0 20px;text-align:center}
.logo{width:88px;height:88px;object-fit:contain;margin:0 auto 14px;border-radius:22px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
h1{font-size:clamp(26px,7vw,38px);letter-spacing:-.02em;line-height:1.1;animation:up .6s .1s both}
.tagline{color:var(--muted);margin-top:6px;animation:up .6s .18s both}
.note{display:inline-block;margin-top:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text);padding:6px 12px;border-radius:999px;font-size:14px;animation:up .6s .26s both}
nav.cats{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cats .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:720px;margin:0 auto;scrollbar-width:none}
.cats .row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:600 14px/1 var(--font);cursor:pointer;transition:background .25s,color .25s,transform .15s;white-space:nowrap;text-decoration:none}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{margin:14px 0 4px;position:relative}
.search input{width:100%;font:16px var(--font);padding:12px 14px 12px 40px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;transition:box-shadow .2s}
.search input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
section.cat{padding-top:22px;scroll-margin-top:62px}
section.cat h2{font-size:22px;letter-spacing:-.01em}
.cdesc{color:var(--muted);font-size:14px;margin-top:2px}
.items{display:grid;gap:12px;margin-top:12px}
@media(min-width:640px){.items{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;border:1px solid var(--line);opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.item.in{opacity:1;transform:none}
.item.off{filter:grayscale(1);opacity:.55}
.item .ph{flex:none;width:92px;height:92px;border-radius:calc(var(--r) - 4px);object-fit:cover;background:var(--line)}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item h3{font-size:16px;line-height:1.25}
.price{font-weight:700;color:var(--accent);white-space:nowrap}
.item p{color:var(--muted);font-size:14px;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--text) 8%,transparent)}
.tag.so{background:var(--text);color:var(--bg)}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}
footer{margin:40px 0 0;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
footer .info{display:grid;gap:6px}
footer a{color:var(--text)}
footer .made{margin-top:16px;font-size:12px;opacity:.7}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.item{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Please enable JavaScript to view this menu.</p></noscript>
<script src="menu-data.js"></script>
<script>
(function(){
var M=window.MENU_DATA;var app=document.getElementById('app');
if(!M){app.innerHTML='<p style="padding:24px;font-family:sans-serif">menu-data.js not found. Put it next to index.html.</p>';return}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function url(s){s=String(s||'');return /^(https?:|data:image\/|assets\/|\.\/|[\w\-]+\.(png|jpe?g|webp|gif|svg)$)/i.test(s)?s:''}
var b=M.business||{},t=M.theme||{},L=M.labels||{};
var fonts={modern:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',classic:'Georgia,"Times New Roman",serif',rounded:'ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif',mono:'ui-monospace,"Cascadia Code",Menlo,monospace'};
var r=document.documentElement.style;
if(t.bg)r.setProperty('--bg',t.bg);if(t.text)r.setProperty('--text',t.text);if(t.accent)r.setProperty('--accent',t.accent);if(t.card)r.setProperty('--card',t.card);
r.setProperty('--font',fonts[t.font]||fonts.modern);if(t.radius!=null)r.setProperty('--r',(+t.radius)+'px');
if(M.lang)document.documentElement.lang=M.lang;
document.title=b.name||'Menu';
function price(p){if(p===''||p==null)return'';var c=b.currency||'';return b.currencyPosition==='before'?c+p:p+(c?' '+c:'')}
var cats=(M.categories||[]).filter(function(c){return c&&(c.items||[]).length});
var h='<header class="hero wrap">';
if(url(b.logo))h+='<img class="logo" src="'+e(url(b.logo))+'" alt="'+e(b.name)+' logo">';
h+='<h1>'+e(b.name||'')+'</h1>';if(b.tagline)h+='<div class="tagline">'+e(b.tagline)+'</div>';
if(b.note)h+='<div class="note">'+e(b.note)+'</div>';h+='</header>';
if(cats.length>1){h+='<nav class="cats" aria-label="Categories"><div class="row">';cats.forEach(function(c,i){h+='<a class="chip'+(i?'':' on')+'" href="#c'+i+'" data-i="'+i+'">'+e(c.name)+'</a>'});h+='</div></nav>'}
h+='<main class="wrap">';
if(M.showSearch!==false)h+='<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="'+e(L.search||'Search…')+'" aria-label="'+e(L.search||'Search')+'"></div>';
cats.forEach(function(c,i){h+='<section class="cat" id="c'+i+'"><h2>'+e(c.name)+'</h2>'+(c.description?'<div class="cdesc">'+e(c.description)+'</div>':'')+'<div class="items">';
 c.items.forEach(function(it){var off=it.available===false,ph=url(it.photo);
  h+='<article class="item'+(off?' off':'')+'" data-s="'+e((it.name+' '+(it.description||'')+' '+(it.tags||[]).join(' ')).toLocaleLowerCase())+'">'+(ph?'<img class="ph" loading="lazy" src="'+e(ph)+'" alt="'+e(it.name)+'">':'')+'<div class="bd"><div class="top"><h3>'+e(it.name)+'</h3><span class="price">'+e(price(it.price))+'</span></div>'+(it.description?'<p>'+e(it.description)+'</p>':'');
  var tg=(it.tags||[]).filter(Boolean);if(tg.length||off){h+='<div class="tags">';if(off)h+='<span class="tag so">'+e(L.soldOut||'Sold out')+'</span>';tg.forEach(function(x){h+='<span class="tag">'+e(x)+'</span>'});h+='</div>'}
  h+='</div></article>'});
 h+='</div></section>'});
h+='<div class="empty" id="empty">'+e(L.noResults||'No results')+'</div></main>';
var inf=[];if(b.hours)inf.push(e(b.hours));if(b.address)inf.push(e(b.address));
if(b.phone)inf.push('<a href="tel:'+e(String(b.phone).replace(/[^\d+]/g,''))+'">'+e(b.phone)+'</a>');
if(b.instagram)inf.push('<a href="https://instagram.com/'+e(String(b.instagram).replace(/^@/,''))+'" rel="noopener">@'+e(String(b.instagram).replace(/^@/,''))+'</a>');
if(b.wifi)inf.push(e(L.wifi||'Wi-Fi')+': '+e(b.wifi));
h+='<footer class="wrap"><div class="info">'+inf.map(function(x){return'<div>'+x+'</div>'}).join('')+'</div>'+(b.footer?'<div class="made">'+e(b.footer)+'</div>':'')+'</footer>';
app.innerHTML=h;
var items=[].slice.call(document.querySelectorAll('.item'));
if('IntersectionObserver'in window){var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){var el=x.target;setTimeout(function(){el.classList.add('in')},(+el.dataset.d||0));io.unobserve(el)}})},{rootMargin:'0px 0px -5% 0px'});items.forEach(function(el,i){el.dataset.d=(i%6)*60;io.observe(el)})}else items.forEach(function(el){el.classList.add('in')});
var chips=[].slice.call(document.querySelectorAll('.chip'));
function act(i){chips.forEach(function(c){c.classList.toggle('on',+c.dataset.i===i)});var a=chips[i];if(a&&a.scrollIntoView)a.parentNode.scrollTo({left:a.offsetLeft-16,behavior:'smooth'})}
if(chips.length&&'IntersectionObserver'in window){var so=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting)act(+x.target.id.slice(1))})},{rootMargin:'-70px 0px -70% 0px'});document.querySelectorAll('section.cat').forEach(function(s){so.observe(s)})}
var q=document.getElementById('q');
if(q)q.addEventListener('input',function(){var v=q.value.trim().toLocaleLowerCase(),any=false;
 document.querySelectorAll('section.cat').forEach(function(s){var n=0;s.querySelectorAll('.item').forEach(function(it){var ok=!v||it.dataset.s.indexOf(v)>-1;it.style.display=ok?'':'none';if(ok){n++;it.classList.add('in')}});s.style.display=n?'':'none';if(n)any=true});
 document.getElementById('empty').style.display=any?'none':'block';var nv=document.querySelector('nav.cats');if(nv)nv.style.display=v?'none':''});
})();
</script>
</body>
</html>
